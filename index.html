
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102d46">
  <meta name="description"
        content="IDVault - Digital identity verification portal">
  <title>IDVault | Identity Verification</title>

  <style>
    :root {
      --navy: #102d46;
      --blue: #1c587d;
      --ink: #1b3042;
      --muted: #71808d;
      --line: #e5ebf0;
      --bg: #f1f5f8;
      --green: #16804c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 25px 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at 10% 10%, #e2edf5, transparent 38%),
        var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .page {
      width: 100%;
      max-width: 440px;
    }

    .brand {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      margin-bottom: 17px;
      color: var(--navy);
      font-weight: 900;
      font-size: 17px;
      letter-spacing: 1.4px;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: var(--navy);
      color: white;
      font-size: 12px;
    }

    .card {
      overflow: hidden;
      border: 1px solid #dfe7ed;
      border-radius: 23px;
      background: white;
      box-shadow: 0 18px 48px rgba(16, 45, 70, .10);
    }

    .header {
      position: relative;
      overflow: hidden;
      padding: 25px 23px;
      color: white;
      background: var(--navy);
    }

    .header::after {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      right: -90px;
      top: -90px;
      border: 24px solid rgba(255,255,255,.055);
      border-radius: 50%;
      pointer-events: none;
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 13px;
      position: relative;
      z-index: 1;
    }

    .shield {
      width: 50px;
      height: 50px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 15px;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.10);
      color: #f1d69b;
      font-size: 21px;
      font-weight: 900;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 21px;
      line-height: 1.2;
    }

    .subtitle {
      margin: 0;
      color: #d0deea;
      font-size: 12px;
    }

    .verified {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      position: relative;
      z-index: 1;
      margin-top: 20px;
      padding: 8px 12px;
      border: 1px solid rgba(111,225,169,.30);
      border-radius: 30px;
      background: rgba(27,135,82,.23);
      color: #d7ffe7;
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .7px;
    }

    .green-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #68e2a2;
    }

    .content {
      padding: 25px 22px;
    }

    .person {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      min-width: 0;
    }

    .photo,
    .initials {
      width: 82px;
      height: 82px;
      flex: 0 0 82px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: #edf2f6;
    }

    .photo {
      display: none;
      object-fit: cover;
    }

    .initials {
      display: grid;
      place-items: center;
      color: var(--navy);
      font-size: 25px;
      font-weight: 850;
    }

    .person-info {
      min-width: 0;
      flex: 1;
    }

    .person-name {
      margin: 0 0 7px;
      font-size: 22px;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .person-id {
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .details {
      border-top: 1px solid var(--line);
    }

    .detail {
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }

    .label {
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .value {
      color: var(--ink);
      font-size: 14px;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .footer {
      padding: 17px 20px;
      border-top: 1px solid var(--line);
      background: #fafcfd;
      color: var(--muted);
      text-align: center;
      font-size: 11px;
      line-height: 1.65;
    }

    .footer strong {
      color: var(--navy);
    }

    .message {
      padding: 40px 23px;
      text-align: center;
    }

    .message-icon {
      width: 60px;
      height: 60px;
      display: grid;
      place-items: center;
      margin: 0 auto 17px;
      border-radius: 50%;
      background: #edf2f6;
      color: var(--navy);
      font-size: 25px;
      font-weight: 850;
    }

    .message h2 {
      margin: 0 0 9px;
      font-size: 20px;
    }

    .message p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .retry {
      margin-top: 18px;
      padding: 11px 20px;
      border: 0;
      border-radius: 12px;
      background: var(--navy);
      color: white;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 360px) {
      body { padding: 12px 8px; }
      .content { padding: 19px 16px; }
      .header { padding: 21px 17px; }
      .person-name { font-size: 19px; }

      .photo,
      .initials {
        width: 68px;
        height: 68px;
        flex-basis: 68px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <div class="brand">
      <span class="brand-mark">ID</span>
      IDVAULT
    </div>

    <section id="profileCard" class="card hidden">
      <header class="header">

        <div class="header-row">
          <div class="shield">ID</div>
          <div>
            <h1>Identity Profile</h1>
            <p class="subtitle">Digital identity verification</p>
          </div>
        </div>

        <div class="verified">
          <span class="green-dot"></span>
          ACTIVE · VERIFIED
        </div>
      </header>

      <div class="content">

        <div class="person">
          <img id="photo" class="photo" alt="Profile photo">
          <div id="initials" class="initials">ID</div>

          <div class="person-info">
            <h2 id="personName" class="person-name"></h2>
            <div id="personId" class="person-id"></div>
          </div>
        </div>

        <div class="details">
          <div class="detail">
            <div class="label">Organization</div>
            <div id="organization" class="value"></div>
          </div>

          <div class="detail">
            <div class="label">ID Category</div>
            <div id="category" class="value"></div>
          </div>

          <div id="groupRow" class="detail">
            <div class="label">Class / Department</div>
            <div id="groupName" class="value"></div>
          </div>
        </div>
      </div>

      <footer class="footer">
        <strong>IDVault Digital Verification</strong><br>
        Only approved public identity information is displayed.
      </footer>
    </section>

    <section id="messageCard" class="card" aria-live="polite">
      <div class="message">
        <div id="messageIcon" class="message-icon">…</div>
        <h2 id="messageTitle">Checking identity</h2>
        <p id="messageText">
          Connecting to IDVault verification service.
        </p>
        <button id="retryButton" class="retry hidden" type="button">
          Try Again
        </button>
      </div>
    </section>

  </main>

  <script>
    // IDVault's NEW Google Apps Script deployment URL.
    const API_ENDPOINT =
      'https://script.google.com/macros/s/AKfycbzY10PuABXbrNDiighOsDriT2NnO9fLTbkNvuKCK5Z8hNSho-qOIrMtPDUQOyR0-U9J/exec';

    const token =
      new URLSearchParams(window.location.search).get('token') || '';

    const messageCard =
      document.getElementById('messageCard');

    const profileCard =
      document.getElementById('profileCard');

    const retryButton =
      document.getElementById('retryButton');

    let requestScript = null;
    let requestTimer = null;
    let requestNumber = 0;

    function showMessage(icon, title, message, retry) {
      document.getElementById('messageIcon').textContent = icon;
      document.getElementById('messageTitle').textContent = title;
      document.getElementById('messageText').textContent = message;

      retryButton.classList.toggle('hidden', !retry);

      messageCard.classList.remove('hidden');
      profileCard.classList.add('hidden');
    }

    function setText(id, value, fallback) {
      document.getElementById(id).textContent =
        value || fallback || '—';
    }

    function getInitials(name) {
      return String(name || 'ID')
        .trim()
        .split(/\s+/)
        .slice(0, 2)
        .map(function(part) {
          return part.charAt(0);
        })
        .join('')
        .toUpperCase();
    }

    function cleanup() {
      if (requestTimer) {
        clearTimeout(requestTimer);
        requestTimer = null;
      }

      if (requestScript) {
        requestScript.remove();
        requestScript = null;
      }

      delete window.IDVaultResponse;
    }

    function renderProfile(data) {
      if (!data || data.ok !== true || !data.person) {
        showMessage(
          '!',
          'ID Not Verified',
          data && data.message
            ? data.message
            : 'This ID could not be verified.',
          false
        );
        return;
      }

      const person = data.person;

      setText('personName', person.fullName, 'Unnamed');
      setText('personId', person.idNumber, 'ID unavailable');
      setText('organization', person.organizationName, 'Not provided');
      setText('category', person.idCategory, 'Not provided');
      setText('groupName', person.groupName, 'Not provided');

      const photo = document.getElementById('photo');
      const initials = document.getElementById('initials');

      initials.textContent = getInitials(person.fullName);
      initials.style.display = 'grid';

      photo.onload = function() {
        photo.style.display = 'block';
        initials.style.display = 'none';
      };

      photo.onerror = function() {
        photo.style.display = 'none';
        initials.style.display = 'grid';
      };

      if (
        typeof person.photoURL === 'string' &&
        /^https?:\/\//i.test(person.photoURL)
      ) {
        photo.src = person.photoURL;
        photo.alt = 'Photo of ' + (person.fullName || 'ID holder');
      } else {
        photo.removeAttribute('src');
        photo.style.display = 'none';
      }

      document.getElementById('groupRow')
        .classList.toggle('hidden', !person.groupName);

      messageCard.classList.add('hidden');
      profileCard.classList.remove('hidden');

      document.title =
        (person.fullName || 'IDVault') +
        ' | Identity Verification';
    }

    function verifyID() {
      cleanup();
      const currentRequest = ++requestNumber;

      if (!/^[a-f0-9]{32}$/i.test(token)) {
        showMessage(
          '!',
          'Invalid QR Code',
          'This QR code does not contain a valid ID token.',
          false
        );
        return;
      }

      showMessage(
        '…',
        'Checking identity',
        'Please wait while IDVault verifies this ID.',
        false
      );

      window.IDVaultResponse = function(data) {
        if (currentRequest !== requestNumber) return;

        cleanup();
        renderProfile(data);
      };

      requestScript = document.createElement('script');

      const parameters = new URLSearchParams({
        token: token,
        callback: 'IDVaultResponse',
        cacheBust: String(Date.now())
      });

      requestScript.src =
        API_ENDPOINT + '?' + parameters.toString();

      requestScript.onerror = function() {
        if (currentRequest !== requestNumber) return;

        cleanup();

        showMessage(
          '!',
          'Connection Failed',
          'The verification service could not be reached. Check your internet connection.',
          true
        );
      };

      document.head.appendChild(requestScript);

      requestTimer = setTimeout(function() {
        if (currentRequest !== requestNumber) return;

        cleanup();

        showMessage(
          '!',
          'Request Timed Out',
          'The verification service took too long to respond. Please try again.',
          true
        );
      }, 20000);
    }

    retryButton.addEventListener('click', verifyID);

    verifyID();
  </script>
</body>
</html>
